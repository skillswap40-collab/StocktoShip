[project]
name = "stocktoship-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI's Depends() in defaults is the intended pattern
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party
known-third-party = ["alembic"]
